{% extends "base.html" %}
{% block head %}
<!-- Tableau Embedding API v3 -->
<script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
{% for name, url in views %}
<section class="viz-block">
  <h2>{{ name }}</h2>
  <tableau-viz src="{{ url }}" toolbar="bottom" hide-tabs device="desktop" width="100%" height="860"></tableau-viz>
  <p class="hint">Not loading? <a href="{{ url }}" target="_blank" rel="noopener">Open on Tableau Public</a>.</p>
</section>
{% endfor %}
{% endblock %}
