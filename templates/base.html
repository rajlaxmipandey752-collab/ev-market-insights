<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EV Market Performance & Insights{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}">⚡ EV Market Insights</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'on' if active=='home' }}">Home</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if active=='dashboard' }}">Dashboard</a>
      <a href="{{ url_for('story') }}" class="{{ 'on' if active=='story' }}">Story</a>
      <a href="{{ url_for('about') }}" class="{{ 'on' if active=='about' }}">About</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Data analytics with Tableau · Electric Vehicle Market Performance & Insights</footer>
</body>
</html>
